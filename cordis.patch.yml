# ============================================================================
# dsh-bili-interact —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# ⚠️ 本插件是 dsh-bili-scroll 的**伴随插件**：必须同时装着 dsh-bili-scroll
#    并完成它的扫码登录，本插件才有 Python 环境与凭证可用（它只读那边的，不复制）。
#
# ⚠️ loader entry 的 id 必须等于插件命名空间名（`bili-interact`），
#    否则 DSH 原生「插件设置」页写设置时会抛 "no volatile fields"。
# ============================================================================

- insert:
    - id: bili-interact
      name: dsh-bili-interact
      config:
        enabled: true
